<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173d28" />
    <title>AgriEnv is offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #193624;
        background:
          radial-gradient(circle at 15% 10%, rgba(184, 215, 103, .2), transparent 28rem),
          linear-gradient(145deg, #f8faf6, #edf3eb);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 480px);
        padding: 32px;
        border: 1px solid #d5e1d6;
        border-radius: 24px;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 24px 70px rgba(18, 56, 32, .12);
        text-align: center;
      }
      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        place-items: center;
        border-radius: 20px;
        background: #155c35;
        box-shadow: 0 12px 30px rgba(21, 92, 53, .2);
      }
      .mark svg { width: 42px; height: 42px; }
      .eyebrow { margin: 0 0 10px; color: #2b7a49; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); line-height: 1.05; letter-spacing: -.04em; }
      p { margin: 16px auto 0; max-width: 360px; color: #68766d; font-size: 14px; line-height: 1.7; }
      button {
        min-height: 46px;
        margin-top: 24px;
        padding: 11px 22px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: #17643a;
        box-shadow: 0 10px 24px rgba(23, 100, 58, .18);
        font: inherit;
        font-size: 14px;
        font-weight: 750;
        cursor: pointer;
      }
      button:hover { background: #0d4e2c; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M32 53V29" stroke="#fff" stroke-width="5" stroke-linecap="round" />
          <path d="M32 33c0-12 8-20 22-20 0 13-8 20-22 20Z" fill="#fff" />
          <path d="M32 40c0-10-7-16-19-16 0 10 7 16 19 16Z" fill="#dff0bd" />
        </svg>
      </span>
      <p class="eyebrow">Connection paused</p>
      <h1>AgriEnv is offline.</h1>
      <p>Your saved app shell is ready. Reconnect to continue simulations, AI study sessions, and live challenges.</p>
      <button type="button" onclick="window.location.reload()">Try reconnecting</button>
    </main>
  </body>
</html>
